<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Banco de Usos de IA</title>
</head>
<body>
  <h1>Banco de Usos de IA</h1>

  <h2>Cadastrar Uso</h2>
  <form id="formUso">
    <input type="text" id="sistema" placeholder="Sistema" required><br><br>
    <input type="text" id="tipo" placeholder="Tipo (empresa, escola...)" required><br><br>
    <input type="text" id="tecnologia" placeholder="Tecnologia" required><br><br>
    <input type="text" id="finalidade" placeholder="Finalidade" required><br><br>
    
    <label>Nível de Risco:</label>
    <select id="nivel_risco">
      <option value="Baixo">Baixo</option>
      <option value="Médio">Médio</option>
      <option value="Alto">Alto</option>
    </select><br><br>

    <label>
      <input type="checkbox" id="possui_revisao_humana"> Possui revisão humana?
    </label><br><br>

    <button type="submit">Salvar</button>
  </form>
  <hr>
   <a href="http://127.0.0.1:3000/usos" target="_blank">Ver dados</a>
  <h1><b>By vitoriabueno1811</b></h1>
</body>
</html>
